<div class="image-lightbox" data-image-lightbox hidden>
    <div class="image-lightbox-backdrop" data-lightbox-close></div>
    <div
        class="image-lightbox-dialog"
        role="dialog"
        aria-modal="true"
        aria-label="Просмотр фотографии"
    >
        <button
            type="button"
            class="image-lightbox-close"
            data-lightbox-close
            aria-label="Закрыть полноэкранный просмотр"
        >×</button>
        <img
            class="image-lightbox-image"
            data-lightbox-image-target
            src=""
            alt=""
        >
        <p class="image-lightbox-error" data-lightbox-error role="alert" hidden>
            Не удалось открыть фотографию.
        </p>
    </div>
</div>
